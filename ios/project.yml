name: CROSSLIST
options:
  bundleIdPrefix: com.crosslist
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  CROSSLIST:
    type: application
    platform: iOS
    sources:
      - path: CROSSLIST
      - path: CROSSLISTCore/Sources/CROSSLISTCore
    resources:
      - path: CROSSLIST/Assets.xcassets
    info:
      path: CROSSLIST/Info.plist
      properties:
        CFBundleDisplayName: CROSSLIST
        CROSSLIST_API_BASE_URL: https://crosslist-production-70f3.up.railway.app/
        NSAppleMusicUsageDescription: CROSSLIST needs Music access to create the playlists you request in your Apple Music library.
        LSRequiresIPhoneOS: true
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:
          - CFBundleURLName: com.crosslist.app
            CFBundleURLSchemes:
              - crosslist
    entitlements:
      path: CROSSLIST/CROSSLIST.entitlements
      properties:
        com.apple.developer.musickit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.crosslist.app
        PRODUCT_NAME: CROSSLIST
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  CROSSLIST:
    build:
      targets:
        CROSSLIST: all
    run:
      config: Debug
    archive:
      config: Release
